<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/auth.js"></script>
  <title>Notifications — ESG Intelligence</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body data-page="notifications">
  <div id="app-shell"></div>
  <main class="page-shell">
    <div id="topbar"></div>
    <section class="page-content" id="page-content">
      <div class="page-heading">
        <div>
          <div class="eyebrow">ALERTING & COMPLIANCE WARNINGS</div>
          <h1>Notification Management Center</h1>
          <p>Review and act on compliance warnings, supplier document expiry alerts, policy updates, and ESG risk findings.</p>
        </div>
        <div class="toolbar">
          <button class="btn btn-secondary" id="page-mark-all-read-btn"><span class="icon">✓</span> Mark All as Read</button>
          <button class="btn btn-secondary" id="page-refresh-action"><span class="icon">↻</span> Refresh Alerts</button>
        </div>
      </div>
      <div id="page-app"></div>
    </section>
  </main>
  <script src="js/mock-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>

</html>
